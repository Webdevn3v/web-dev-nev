<style>
:root{color-scheme:dark;--ink:#080a0c;--cream:#eeedef;--muted:#b8b9ba;--gold:#c9a66a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh;background:var(--ink);color:var(--cream);font-family:Arial,Helvetica,sans-serif;display:flex;align-items:center;justify-content:center;padding:32px 22px;padding-top:max(32px,env(safe-area-inset-top));padding-bottom:max(32px,env(safe-area-inset-bottom))}
main{width:100%;max-width:420px}
.brand{font-size:22px;letter-spacing:-.8px;margin:0 0 54px}

.role{color:var(--gold);font-size:13px;line-height:1.6;margin:0 0 30px}
.details{padding:22px 0;border-top:1px solid #26282b;border-bottom:1px solid #26282b;margin-bottom:24px}
.details a{display:block;width:fit-content;max-width:100%;overflow-wrap:anywhere;color:var(--cream);text-decoration:none;font-size:16px;line-height:1.7;padding:5px 0}
.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.actions a,.save{display:flex;align-items:center;justify-content:center;min-height:52px;border:1px solid #48423a;border-radius:6px;color:var(--cream);text-decoration:none;font-size:15px}
.actions a:hover{background:#181614}
.save{margin-top:12px;background:var(--cream);color:var(--ink);border-color:var(--cream);font-weight:600}
a:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
.tagline{margin:32px 0 0;color:var(--muted);font-size:10px;letter-spacing:2px;line-height:1.5}
</style>
</head>
