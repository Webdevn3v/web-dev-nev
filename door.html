<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Digital Side — Digital Door</title>
<meta name="description" content="The Digital Side — quick entrance. Start a project, view the work, see what I do, or email directly.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --black:#0F1113;
  --graphite:#242628;
  --gray:#5A5F63;
  --off:#F3F1EC;
  --lime:#A6FF00;
  --mono:'Space Mono',monospace;
  --ease:cubic-bezier(.25,.46,.45,.94);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%;scroll-behavior:smooth}
body{
  min-height:100%;
  background:var(--black);
  color:var(--off);
  font-family:var(--mono);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}

/* faint dot-grid, whole page, never competitive with content */
body{
  background-image:radial-gradient(rgba(90,95,99,.18) 1px,transparent 1px);
  background-size:26px 26px;
}

/* ══════════════════════════════
   STAGE 1 — LOGO
══════════════════════════════ */
.stage-logo{
  position:relative;
  min-height:100svh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 20px) 24px calc(env(safe-area-inset-bottom,0px) + 20px);
  overflow:hidden;
}

.circuit{position:absolute;top:0;right:0;width:150px;height:210px;pointer-events:none;opacity:.5;z-index:0}
.circuit svg{width:100%;height:100%}
.circuit line,.circuit path{stroke:var(--graphite);stroke-width:1;fill:none}
.circuit circle{fill:var(--black);stroke:var(--graphite);stroke-width:1}
.circuit circle.lit{fill:var(--lime);stroke:none;opacity:.9;animation:litPulse 2.4s ease-in-out infinite}
@keyframes litPulse{0%,100%{opacity:.5}50%{opacity:1}}

.online{
  position:absolute;top:calc(env(safe-area-inset-top,0px) + 20px);left:22px;
  z-index:2;display:flex;align-items:center;gap:9px;
  font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gray);
}
.online-dot{width:8px;height:8px;background:var(--lime);box-shadow:0 0 8px rgba(166,255,0,.7);flex-shrink:0}

.logo-glow{
  position:absolute;
  width:70vw;height:70vw;max-width:420px;max-height:420px;
  background:radial-gradient(circle,rgba(166,255,0,.09) 0%,transparent 68%);
  pointer-events:none;z-index:0;
  animation:glowBreathe 5s ease-in-out infinite;
}
@keyframes glowBreathe{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}

.logo-wrap{
  position:relative;z-index:1;
  width:min(62vw,320px);
  animation:logoIn 1.1s var(--ease) both;
}
@keyframes logoIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.logo-wrap img{width:100%;height:auto}

.scroll-cue{
  position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);left:50%;
  transform:translateX(-50%);z-index:1;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gray);
}
.scroll-cue-line{width:1px;height:32px;background:linear-gradient(to bottom,var(--lime),transparent);animation:cueMove 2s ease-in-out infinite}
@keyframes cueMove{0%{transform:scaleY(0);transform-origin:top;opacity:0}40%{opacity:1}60%{transform:scaleY(1);transform-origin:top}60.01%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom;opacity:0}}

/* ══════════════════════════════
   STAGE 2 — PATHS
══════════════════════════════ */
.stage-paths{
  position:relative;z-index:1;
  max-width:460px;margin:0 auto;
  padding:8px 24px calc(env(safe-area-inset-bottom,0px) + 36px);
}

.headline{font-weight:700;font-size:clamp(1.2rem,5.5vw,1.45rem);color:var(--off);text-align:center;margin-bottom:8px}
.headline .lime{color:var(--lime)}
.sub{font-size:.82rem;line-height:1.6;color:var(--gray);text-align:center;max-width:320px;margin:0 auto 30px}

nav.paths{display:flex;flex-direction:column;gap:11px}
.path-btn{
  -webkit-tap-highlight-color:transparent;
  display:flex;align-items:center;gap:14px;
  min-height:58px;padding:13px 17px;
  background:rgba(36,38,40,.4);
  border:1px solid var(--graphite);
  clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px);
  transition:border-color .2s var(--ease),background .2s var(--ease);
}
.path-btn:active{border-color:var(--lime);background:rgba(166,255,0,.06)}
.path-num{font-weight:700;font-size:1.05rem;color:var(--lime);flex-shrink:0;width:24px}
.path-sep{width:1px;align-self:stretch;background:var(--graphite);flex-shrink:0}
.path-label{font-weight:700;font-size:.78rem;letter-spacing:.05em;text-transform:uppercase;color:var(--off);flex:1}
.path-arrow{color:var(--lime);flex-shrink:0;transition:transform .2s var(--ease)}
.path-btn:active .path-arrow{transform:translateX(4px)}
.path-btn--secondary{background:transparent;border-style:dashed}
.path-btn--secondary .path-num,.path-btn--secondary .path-arrow{color:var(--gray)}
.path-btn--secondary:active{border-color:var(--gray);background:rgba(90,95,99,.08)}

footer{text-align:center;margin-top:28px;font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;color:var(--graphite)}

@media(min-height:800px){
  .headline{margin-top:8px}
}
</style>
</head>
<body>

<!-- STAGE 1: the logo IS the door -->
<div class="stage-logo">
  <div class="circuit" aria-hidden="true">
    <svg viewBox="0 0 150 210" xmlns="http://www.w3.org/2000/svg">
      <path d="M150 30 L112 30 L112 76 L132 76 L132 148 L102 148 L102 210" />
      <line x1="150" y1="54" x2="128" y2="54" />
      <circle cx="112" cy="30" r="3" />
      <circle cx="132" cy="76" r="3" class="lit" />
      <circle cx="102" cy="148" r="3" />
    </svg>
  </div>

  <div class="online">
    <span class="online-dot"></span>Online
  </div>

  <div class="logo-glow" aria-hidden="true"></div>

  <div class="logo-wrap">
    <img src="tds-logo.webp" alt="The Digital Side" width="1024" height="1536">
  </div>

  <div class="scroll-cue">
    <span>Scroll</span>
    <div class="scroll-cue-line"></div>
  </div>
</div>

<!-- STAGE 2: the customer paths -->
<div class="stage-paths">

  <p class="sub">Custom websites, digital systems, and mobile experiences that move businesses forward.</p>

  <nav class="paths" aria-label="Digital Door quick paths">
    <a href="index.html#contact" class="path-btn">
      <span class="path-num">01</span><span class="path-sep"></span>
      <span class="path-label">Start a Project</span><span class="path-arrow">→</span>
    </a>
    <a href="index.html#work" class="path-btn">
      <span class="path-num">02</span><span class="path-sep"></span>
      <span class="path-label">View the Work</span><span class="path-arrow">→</span>
    </a>
    <a href="index.html#services" class="path-btn">
      <span class="path-num">03</span><span class="path-sep"></span>
      <span class="path-label">What I Do</span><span class="path-arrow">→</span>
    </a>
    <a href="mailto:webdevn3v@gmail.com" class="path-btn">
      <span class="path-num">04</span><span class="path-sep"></span>
      <span class="path-label">Email Directly</span><span class="path-arrow">→</span>
    </a>
    <a href="index.html" class="path-btn path-btn--secondary">
      <span class="path-num">05</span><span class="path-sep"></span>
      <span class="path-label">View Full Site</span><span class="path-arrow">→</span>
    </a>
  </nav>

  <footer>thedigitalside.com</footer>
</div>

</body>
</html>
