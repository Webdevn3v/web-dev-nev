<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marsh Brothers Owner Key</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --graphite-950:#0d0f11;--graphite-900:#15181a;--paper:#f2efe8;
  --copper:#c17a4a;--copper-soft:#e0a374;--copper-glow:rgba(193,122,74,.28);
  --cool:#5b93ac;--cool-soft:#9bcadd;--cool-glow:rgba(91,147,172,.26);
  --display:'Archivo',Arial,sans-serif;--sans:'Archivo',Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;background:var(--graphite-950);display:grid;place-items:center;font-family:var(--sans);color:var(--paper)}
.phone{width:min(430px,100vw);min-height:100svh;padding:34px 28px;display:flex;flex-direction:column;text-align:center;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 38%,var(--cool-glow),transparent 30%),linear-gradient(var(--graphite-950),var(--graphite-900))}
.wave,.wave2{position:absolute;width:120%;height:28%;left:-10%;border-radius:50%;transform:rotate(-10deg)}
.wave{top:10%;border:2px solid rgba(193,122,74,.32)}
.wave2{bottom:9%;transform:rotate(8deg);border:2px solid rgba(91,147,172,.28)}
.content{position:relative;z-index:2;display:flex;flex-direction:column;min-height:calc(100svh - 68px)}
.logo{font:900 .82rem var(--display);letter-spacing:.05em;display:flex;flex-direction:column;align-items:center;gap:8px}
.logo .icon{width:34px;height:26px}
.logo .submark{display:block;font:600 .72rem var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.owner{font-size:.92rem;letter-spacing:.18em;text-transform:uppercase;margin-top:24px;font-weight:600}
.qr{width:210px;height:210px;margin:auto;display:block;mix-blend-mode:screen}
.tag{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;line-height:1.8;color:#dcecf1}
.line{width:48px;height:1px;background:#8ea3ab;margin:18px auto}
</style>
</head>
<body>
<main class="phone">
  <div class="wave"></div><div class="wave2"></div>
  <div class="content">
    <div class="logo"><svg class="icon" viewBox="0 0 32 24" fill="none" aria-hidden="true"><path d="M10 3c0 0-5 6-5 10a5 5 0 0 0 10 0c0-2.4-1.6-4-1.6-4s.4 2.4-1.2 2.4c-.8 0-1.2-.8-.8-1.6.4-.8.8-1.6-.4-3.2C10.4 5.2 10 3 10 3z" fill="#e0a374"/><g stroke="#9bcadd" stroke-width="1.3" stroke-linecap="round"><line x1="24" y1="6" x2="24" y2="18"/><line x1="18.5" y1="9" x2="29.5" y2="15"/><line x1="29.5" y1="9" x2="18.5" y2="15"/></g></svg>MARSH BROTHERS<span class="submark">Heating &amp; Air</span></div>
    <div class="owner">Owner Key</div>
    <img class="qr" alt="Scan to open Marsh Brothers Digital Door" src="https://api.qrserver.com/v1/create-qr-code/?size=340x340&amp;data=https%3A%2F%2Fthedigitalside.org%2Fhvac-door.html&amp;color=C17A4A&amp;bgcolor=0D0F11&amp;margin=0">
    <div class="tag">Comfort Keeps<br>Life Moving.</div>
    <div class="line"></div>
  </div>
</main>
</body>
</html>
