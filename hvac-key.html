*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#02070c;color:#eef9ff;font-family:Arial,sans-serif;display:grid;place-items:center}.key{width:min(430px,100vw);min-height:100vh;padding:54px 34px 40px;background:radial-gradient(circle at 50% 45%,rgba(0,170,255,.2),transparent 28%),linear-gradient(#04111c,#02070c);display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;overflow:hidden}.key:before,.key:after{content:'';position:absolute;width:120vw;height:36vh;border:2px solid rgba(16,200,255,.18);border-radius:50%;transform:rotate(-18deg)}.key:after{transform:rotate(24deg);top:35%}.mark{position:relative;z-index:2;font-weight:800;letter-spacing:.12em}.wave{display:block;color:#10c8ff;font-size:3rem;margin-bottom:8px}.title{position:relative;z-index:2;margin-top:74px;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:#a9c8d8}.qr{position:relative;z-index:2;margin-top:22px;width:188px;aspect-ratio:1;background:repeating-linear-gradient(0deg,#10c8ff 0 8px,#06121d 8px 16px),repeating-linear-gradient(90deg,#10c8ff 0 8px,#06121d 8px 16px);background-blend-mode:screen;border:1px solid rgba(16,200,255,.7);opacity:.8}.qr:after{content:'≋';position:absolute;inset:35%;display:grid;place-items:center;background:#03101a;color:#10c8ff;font-size:2rem}.tag{position:relative;z-index:2;margin-top:28px;font-weight:700;letter-spacing:.08em}.foot{position:relative;z-index:2;margin-top:auto;font-size:.67rem;letter-spacing:.16em;text-transform:uppercase;color:#8eb4c7}</style></head><body><div class="key"><div class="mark"><span class="wave">≋</span>NORTHFLOW<br>HVAC</div><div class="title">Owner Key</div><div class="qr" aria-label="QR placeholder"></div><div class="tag">Comfort keeps life moving.</div><div class="foot">Scan to open the Digital Door</div></div></body></html>
