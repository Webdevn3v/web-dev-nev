[package]
name = "tds-command-center"
version = "0.1.0"
description = "The Digital Side local-first Command Center"
authors = ["The Digital Side"]
edition = "2021"

[lib]
name = "tds_command_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-stronghold = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev.package.scrypt]
opt-level = 3
