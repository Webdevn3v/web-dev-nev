[package]
name = "tds-command-center"
version = "0.1.0"
description = "The Digital Side local-first Command Center"
authors = ["The Digital Side"]
edition = "2021"

[lib]
name = "tds_command_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-stronghold = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Jarvie Phase C (docs/JARVIE-PHASE-C.md): the only outbound HTTPS call in the app, made
# native-side so the API key never touches the renderer. reqwest is already in the tree via
# Tauri; this adds json + a TLS backend. native-tls => SChannel on the Windows target (zero
# extra system deps) and the OS OpenSSL on Linux/macOS — much lighter than the rustls +
# aws-lc-sys (C/asm) build the `rustls` feature pulls.
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "http2"] }

[profile.dev.package.scrypt]
opt-level = 3
