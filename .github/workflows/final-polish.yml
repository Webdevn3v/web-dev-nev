name: Final Digital Side polish
on:
  push:
    branches:
      - codex/inspect-repository-and-create-project-map
    paths:
      - scripts/finalize_digital_side.py
      - .github/workflows/final-polish.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/inspect-repository-and-create-project-map
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic polish
        run: python scripts/finalize_digital_side.py
      - name: Commit generated edits
        run: |
          if git diff --quiet; then
            echo "No generated edits needed."
            exit 0
          fi
          git config user.name "digital-side-build"
          git config user.email "actions@users.noreply.github.com"
          git add index.html door-frederick-legacy-law.html lumina-door.html lumina-mobile-site.html northline-door.html northline-mobile-site.html northline-full-site.html atelier-door.html atelier-house-mobile-site.html atelier-house-full-site.html
          git commit -m "Finish demo routing analytics and homepage polish"
          git push
