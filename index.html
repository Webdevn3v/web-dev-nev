<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Dev Nev — Modern Websites for Local Businesses</title>
<style>
/* ══════════════════════════════════════════
   TOKENS
══════════════════════════════════════════ */
:root {
  --black:     #080a0c;
  --dark:      #0d1014;
  --card:      #111519;
  --card-lt:   #161b21;
  --border:    rgba(255,255,255,.07);
  --border-md: rgba(255,255,255,.12);
  --lime:      #a0a8b4;
  --lime-dk:   #7e8896;
  --lime-glow: rgba(160,168,180,.15);
  --lime-glow2:rgba(160,168,180,.08);
  --white:     #ffffff;
  --off:       #f0f0f2;
  --light:     #c8c8cc;
  --muted:     #6b6b78;
  --fog:       #3d3d46;

  --display: 'Courier New', 'Courier', monospace;
  --heading: 'Trebuchet MS','Segoe UI',Helvetica,sans-serif;
  --body:    'Gill Sans','Gill Sans MT',Calibri,sans-serif;

  --max: 1100px;
  --r:   6px;
  --r-lg: 14px;
  --r-xl: 22px;

  --ease:      cubic-bezier(.25,.46,.45,.94);
  --ease-back: cubic-bezier(.34,1.56,.64,1);

  --sh-lime: 0 0 32px rgba(160,168,180,.2), 0 8px 40px rgba(160,168,180,.1);
  --sh-card: 0 4px 24px rgba(0,0,0,.4);
  --sh-hover:0 20px 60px rgba(0,0,0,.6);
}

/* ══════════════════════════════════════════
   RESET
══════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--body);
  background:var(--black);
  color:var(--light);
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
ul{list-style:none}
button,input,textarea{font-family:inherit;font-size:inherit;border:none;outline:none;background:none}

/* scanline grain */
body::after{
  content:'';
  position:fixed;inset:0;
  background-image:repeating-linear-gradient(
    0deg,
    rgba(0,0,0,.03) 0px,rgba(0,0,0,.03) 1px,
    transparent 1px,transparent 3px
  );
  pointer-events:none;z-index:9999;
}

/* ══════════════════════════════════════════
   UTILITY
══════════════════════════════════════════ */
.container{width:100%;max-width:var(--max);margin:0 auto;padding:0 28px}
.section{padding:112px 0}
.section--alt{background:var(--dark)}

.tag{
  display:inline-flex;align-items:center;gap:8px;
  font-family:var(--display);
  font-size:.65rem;letter-spacing:.22em;text-transform:uppercase;
  color:var(--lime);
  margin-bottom:18px;
}
.tag::before{content:'>';margin-right:2px;opacity:.6}

h2{
  font-family:var(--heading);
  font-size:clamp(2rem,4vw,3rem);
  font-weight:800;
  line-height:1.1;
  letter-spacing:-.03em;
  color:var(--white);
}
h3{
  font-family:var(--heading);
  font-size:1.15rem;font-weight:700;
  color:var(--white);letter-spacing:-.01em;
}

.lead{
  font-size:clamp(.92rem,1.3vw,1.05rem);
  color:var(--muted);
  line-height:1.85;max-width:540px;
}

.btn{
  display:inline-flex;align-items:center;gap:9px;
  padding:14px 32px;
  border-radius:var(--r);
  font-family:var(--heading);
  font-size:.82rem;font-weight:700;
  letter-spacing:.05em;
  cursor:pointer;
  transition:all .28s var(--ease);
  position:relative;overflow:hidden;
}
.btn::before{
  content:'';position:absolute;inset:0;
  background:rgba(255,255,255,.08);
  transform:translateX(-101%);
  transition:transform .32s var(--ease);
}
.btn:hover::before{transform:none}
.btn--lime{
  background:var(--lime);color:var(--black);
  box-shadow:var(--sh-lime);
}
.btn--lime:hover{
  background:var(--lime-dk);
  transform:translateY(-3px);
  box-shadow:0 16px 48px rgba(168,255,62,.3);
}
.btn--outline{
  border:1.5px solid var(--border-md);color:var(--white);
}
.btn--outline:hover{
  border-color:var(--lime);color:var(--lime);
  transform:translateY(-3px);
}
.btn--ghost{
  border:1.5px solid var(--border);color:var(--muted);
  font-size:.75rem;padding:10px 22px;
}
.btn--ghost:hover{
  border-color:var(--lime);color:var(--lime);
}
.btn__arr{transition:transform .25s var(--ease-back)}
.btn:hover .btn__arr{transform:translateX(5px)}

/* ══════════════════════════════════════════
   CURSOR DOT
══════════════════════════════════════════ */
.c-dot{
  width:8px;height:8px;background:var(--lime);
  border-radius:50%;position:fixed;pointer-events:none;
  z-index:9998;transform:translate(-50%,-50%);
  transition:transform .1s;
  box-shadow:0 0 12px var(--lime);
}
.c-ring{
  width:32px;height:32px;
  border:1.5px solid rgba(168,255,62,.5);
  border-radius:50%;position:fixed;pointer-events:none;
  z-index:9997;transform:translate(-50%,-50%);
  transition:all .18s var(--ease);
}
body.hov .c-ring{width:48px;height:48px;opacity:.35}
@media(pointer:coarse){.c-dot,.c-ring{display:none}}

/* ══════════════════════════════════════════
   NAV
══════════════════════════════════════════ */
.nav{
  position:sticky;top:0;z-index:200;
  background:rgba(8,10,12,.94);
  backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid var(--border);
  transition:all .3s var(--ease);
}
.nav.sc{
  border-bottom-color:rgba(168,255,62,.15);
  box-shadow:0 4px 32px rgba(0,0,0,.5);
}
.nav__inner{
  display:flex;align-items:center;justify-content:space-between;
  height:66px;
}
.nav__logo{
  font-family:var(--display);
  font-size:1.1rem;letter-spacing:.08em;
  color:var(--white);
  display:flex;align-items:center;gap:6px;
}
.nav__logo-bracket{color:var(--lime);font-size:1.3rem;line-height:1}
.nav__logo-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--lime);
  box-shadow:0 0 8px var(--lime);
  animation:logoPulse 2.5s infinite;
}
@keyframes logoPulse{0%,100%{box-shadow:0 0 5px var(--lime)}50%{box-shadow:0 0 16px var(--lime),0 0 28px rgba(168,255,62,.4)}}

.nav__links{display:flex;align-items:center;gap:28px}
.nav__links a{
  font-size:.74rem;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);transition:color .2s;
  position:relative;
}
.nav__links a::after{
  content:'';position:absolute;
  bottom:-3px;left:0;right:0;height:1px;
  background:var(--lime);
  transform:scaleX(0);transform-origin:left;
  transition:transform .25s var(--ease);
}
.nav__links a:hover{color:var(--white)}
.nav__links a:hover::after{transform:scaleX(1)}
.nav__right{display:flex;align-items:center;gap:14px}
.nav__cta{padding:10px 22px;font-size:.74rem;display:none}
.nav__ham{
  display:none;flex-direction:column;gap:5px;
  cursor:pointer;padding:8px;
}
.nav__ham span{
  display:block;width:22px;height:1.5px;
  background:var(--white);border-radius:1px;
  transition:all .3s var(--ease);
}
.nav__ham.op span:nth-child(1){transform:translateY(6.5px) rotate(45deg)}
.nav__ham.op span:nth-child(2){opacity:0;transform:scaleX(0)}
.nav__ham.op span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg)}
@media(min-width:820px){.nav__cta{display:inline-flex}}
@media(max-width:740px){.nav__links{display:none}.nav__ham{display:flex}}

/* mobile drawer */
.mob{
  position:fixed;inset:0;top:66px;
  background:var(--black);z-index:190;
  display:flex;flex-direction:column;padding:48px 28px;
  transform:translateX(-100%);
  transition:transform .42s var(--ease);
  border-top:1px solid var(--border);
}
.mob.op{transform:none}
.mob a{
  font-family:var(--heading);font-size:2rem;font-weight:800;
  color:var(--white);padding:14px 0;
  border-bottom:1px solid var(--border);
  transition:color .2s,padding-left .2s;letter-spacing:-.02em;
}
.mob a:hover{color:var(--lime);padding-left:10px}
.mob .btn{margin-top:32px;justify-content:center}

/* ══════════════════════════════════════════
   HERO
══════════════════════════════════════════ */
.hero{
  min-height:100vh;
  position:relative;
  display:flex;align-items:center;
  overflow:hidden;
  background:var(--black);
}
.hero__grid{
  position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(160,168,176,.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(160,168,176,.03) 1px,transparent 1px);
  background-size:52px 52px;
  animation:gridDrift 25s linear infinite;
}
@keyframes gridDrift{0%{transform:translateY(0)}100%{transform:translateY(52px)}}

  width:70vw;height:70vh;
  background:radial-gradient(ellipse,rgba(
