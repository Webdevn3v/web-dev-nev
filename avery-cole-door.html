<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Avery Cole Digital Door</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#090705;color:#f6efe4;font-family:Arial,sans-serif}button,a{font:inherit;color:inherit}
.entry{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:radial-gradient(circle at 50% 18%,#3a2b1c 0,#120d09 36%,#080604 72%);perspective:1600px;transition:.6s}
.entry.done{opacity:0;visibility:hidden;pointer-events:none}.wrap{text-align:center;width:min(520px,92vw)}
.name{font:400 2rem Georgia,serif;letter-spacing:.18em}.sub{font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:#ccb895;margin:8px 0 18px}
.frame{width:min(360px,76vw);height:min(620px,66svh);margin:auto;border:1px solid #725a3d;box-shadow:0 24px 70px #000}
.door{width:100%;height:100%;border:0;background:linear-gradient(155deg,#211911,#090705 72%);position:relative;cursor:pointer;transform-origin:left center;transition:transform 1.15s cubic-bezier(.65,0,.35,1);box-shadow:inset 0 0 0 18px #100c09,inset 0 0 0 20px #5b452c}
.entry.open .door{transform:rotateY(-105deg)}.mono{font:400 7rem Georgia,serif;color:#d7b27a;position:absolute;inset:0;display:grid;place-items:center;letter-spacing:-.16em}.msg{position:absolute;left:0;right:0;bottom:16%;font:400 .65rem/1.8 Georgia,serif;letter-spacing:.2em;text-transform:uppercase;color:#e9d1ac}
.open{border:0;background:transparent;margin-top:16px;text-transform:uppercase;letter-spacing:.2em;font-size:.58rem}.open:before{content:"⌄";display:block;font-size:2rem;color:#d7b27a}
.path{min-height:100svh;background:linear-gradient(#1a120c,#090705);padding:22px 16px}.inner{width:min(720px,100%);margin:auto;text-align:center}.inner h1{font:400 2rem Georgia,serif;letter-spacing:.16em;margin:0}.inner p{font-size:.56rem;letter-spacing:.18em;text-transform:uppercase;color:#c9b393}.inner h2{font:italic 400 clamp(2rem,7vw,4rem)/1 Georgia,serif;margin:42px 0 18px}.call{display:block;background:#f5efe6;color:#100d0a;border-radius:999px;padding:16px;margin-bottom:14px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;text-decoration:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{border:1px solid #493722;background:#120d09;border-radius:14px;padding:22px 12px;min-height:108px;display:grid;place-items:center;text-decoration:none}.card b{font:400 1rem Georgia,serif}.utils{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:18px;padding-top:16px;border-top:1px solid #493722}.utils a{font-size:.48rem;text-transform:uppercase;text-decoration:none}.dot{display:grid;place-items:center;width:34px;height:34px;border:1px solid #725a3d;border-radius:50%;margin:auto auto 6px;color:#d7b27a}
</style></head><body>
<section class="entry" id="entry"><div class="wrap"><div class="name">AVERY COLE</div><div class="sub">REALTOR | Howard County, Maryland</div><div class="frame"><button class="door" id="door"><div class="mono">AC</div><div class="msg">Your Next Move<br>Starts Here.</div></button></div><button class="open" id="openDoor">Open the Door</button></div></section>
<main class="path"><div class="inner"><h1>AVERY COLE</h1><p>REALTOR | Howard County, Maryland</p><h2>Let's find your<br>next move.</h2><a class="call" href="#">Call Avery</a><div class="grid"><a class="card" href="realtor-index.html#properties"><b>View Listings</b></a><a class="card" href="#"><b>Book a Showing</b></a><a class="card" href="#"><b>I'm Buying</b></a><a class="card" href="#"><b>I'm Selling</b></a></div><nav class="utils"><a href="realtor-key.html"><span class="dot">+</span>Save Contact</a><a href="#"><span class="dot">C</span>Call Now</a><a href="#"><span class="dot">T</span>Text</a><a href="#"><span class="dot">@</span>Email</a><a href="realtor-index.html"><span class="dot">S</span>Full Site</a></nav></div></main>
<script>const e=document.getElementById('entry');const go=()=>{e.classList.add('open');setTimeout(()=>e.classList.add('done'),1150)};document.getElementById('door').onclick=go;document.getElementById('openDoor').onclick=go;</script>
</body></html>
