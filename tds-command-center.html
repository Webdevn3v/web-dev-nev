<title>The Digital Side — Command Center</title>
<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="tds-logo.webp">

<style>
:root{
  --black:#080A0C;--charcoal:#141316;--graphite:#26282B;--soft:#B8B9BA;--off:#EEEDEF;
  --lime:#A6FF00;--amber:#F1B84B;--red:#FF5E57;--line:rgba(255,255,255,.09);
  --mono:'Space Mono',monospace;--sans:'Inter',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--black);color:var(--off);font-family:var(--sans)}
body{background:radial-gradient(circle at 72% 8%,rgba(166,255,0,.06),transparent 30%),linear-gradient(180deg,#0b0d0f 0%,#080A0C 100%)}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--lime)}
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.rail{border-right:1px solid var(--line);background:rgba(12,13,15,.9);padding:20px 12px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px 18px;border-bottom:1px solid var(--line)}
.brand__dot{width:8px;height:8px;background:var(--lime);box-shadow:0 0 16px var(--lime);border-radius:50%;flex:none}
.brand strong{display:block;font-size:.86rem}
.brand small{display:block;font:.5rem var(--mono);letter-spacing:.14em;color:#656b70;margin-top:3px}
nav{padding-top:14px;display:grid;gap:3px}
.navbtn{background:transparent;border:1px solid transparent;color:#8d9298;border-radius:7px;text-align:left;padding:8px 10px;cursor:pointer;font-size:.74rem;display:flex;justify-content:space-between;width:100%}
.navbtn:hover{background:#15181b;color:var(--off)}
.navbtn.active{border-color:rgba(166,255,0,.2);background:rgba(166,255,0,.07);color:var(--lime)}
.rail__footer{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line);font:.54rem var(--mono);color:#656b70;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.sysdot{width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 10px rgba(166,255,0,.55);flex:none}
.sysdot.off{background:var(--amber);box-shadow:none}
.stage{overflow-x:hidden;padding:26px 32px 80px;min-width:0}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.eyebrow{font:.55rem var(--mono);letter-spacing:.18em;color:#656b70}
.topbar h1{font-size:1.5rem;margin:5px 0 0}
.topbar__right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.capture{display:flex;gap:6px;align-items:center;background:#101214;border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:220px}
.capture input{background:transparent;border:0;outline:0;color:var(--off);font-size:.76rem;width:190px}
.capture input::placeholder{color:#656b70}
.iconbtn{border:1px solid var(--line);background:#181b1e;color:var(--soft);border-radius:7px;padding:7px 10px;cursor:pointer;font-size:.7rem;white-space:nowrap}
.iconbtn:hover{border-color:rgba(166,255,0,.4);color:var(--off)}
.grid{display:grid;gap:12px}
.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:linear-gradient(180deg,rgba(24,26,29,.92),rgba(17,19,21,.92));border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 14px 40px rgba(0,0,0,.2);min-width:0}
.card.glow{border-color:rgba(166,255,0,.18);box-shadow:inset 0 0 40px rgba(166,255,0,.025),0 14px 40px rgba(0,0,0,.24)}
.card.attn{border-color:rgba(241,184,75,.3)}
.kicker{font:.54rem var(--mono);letter-spacing:.12em;color:#656b70;text-transform:uppercase}
.big{font-size:1.15rem;font-weight:700;margin-top:5px}
.muted{color:#8d9298;font-size:.78rem;line-height:1.5}
.metric{font:700 1.7rem var(--mono);color:var(--lime)}
.btn{border:1px solid var(--line);background:#181b1e;color:var(--off);border-radius:7px;padding:7px 11px;cursor:pointer;font-size:.72rem}
.btn:hover{border-color:rgba(166,255,0,.45)}
.btn.primary{background:var(--lime);border-color:var(--lime);color:#090b0c;font-weight:700}
.btn.danger{border-color:rgba(255,94,87,.4);color:#ff8b86}
.btn.small{padding:5px 8px;font-size:.66rem}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.pill{font:.55rem var(--mono);letter-spacing:.05em;border:1px solid var(--line);padding:4px 8px;border-radius:20px;color:#9aa0a6;white-space:nowrap;display:inline-block}
.pill.warn{border-color:rgba(241,184,75,.35);color:var(--amber)}
.pill.good{border-color:rgba(166,255,0,.3);color:var(--lime)}
.pill.bad{border-color:rgba(255,94,87,.35);color:#ff8b86}
.pill.neutral{color:#7d838a}
.progress{height:5px;background:#25292d;border-radius:4px;overflow:hidden;margin-top:10px}
.progress span{display:block;height:100%;background:var(--lime)}
.field{margin-top:11px}
.field label{display:block;font:.54rem var(--mono);letter-spacing:.08em;color:#72787e;margin-bottom:5px;text-transform:uppercase}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#0f1113;color:var(--off);padding:8px 9px;border-radius:7px}
.field textarea{min-height:70px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:rgba(166,255,0,.5)}
table{width:100%;border-collapse:collapse;font-size:.76rem}
th{text-align:left;font:.52rem var(--mono);letter-spacing:.08em;color:#656b70;text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.tablewrap{overflow-x:auto}
.row-flex{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:10px 0;font-size:.78rem;gap:10px}
.row-flex:last-child{border-bottom:0}
.checkline{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:.76rem}
.checkline input{accent-color:var(--lime)}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.bar select,.bar input{border:1px solid var(--line);background:#101214;color:var(--off);border-radius:7px;padding:6px 8px;font-size:.72rem}
.overlay{position:fixed;inset:0;background:rgba(4,5,6,.72);display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow-y:auto}
.overlay.open{display:flex}
.modal{background:#101214;border:1px solid var(--line);border-radius:12px;padding:20px;width:min(640px,100%);box-shadow:0 30px 80px rgba(0,0,0,.5)}
.modal__top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.modal__top h3{margin:0;font-size:1rem}
.palette{width:min(560px,100%)}
.palette input{width:100%;background:#0b0d0e;border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--off);font-size:.86rem;outline:none}
.palette input:focus{border-color:rgba(166,255,0,.5)}
.palette__list{margin-top:10px;max-height:50vh;overflow-y:auto}
.palette__item{padding:9px 10px;border-radius:7px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-size:.78rem}
.palette__item:hover{background:#181b1e}
.palette__item span:last-child{color:#656b70;font:.6rem var(--mono)}
.empty{padding:22px 10px;text-align:center;color:#656b70;font-size:.8rem}
.tabbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabbar button{border:1px solid var(--line);background:#111315;color:#82888e;padding:7px 12px;border-radius:20px;font-size:.7rem;cursor:pointer}
.tabbar button.active{border-color:rgba(166,255,0,.35);color:var(--lime);background:rgba(166,255,0,.06)}
.linklist a{display:block;font-size:.76rem;margin-top:4px;word-break:break-all}
.close{background:transparent;border:0;color:#8d9298;font-size:1.1rem;cursor:pointer;line-height:1}
.close:hover{color:var(--off)}
.doorgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 16px}
@media(max-width:1000px){.grid.three,.grid.four{grid-template-columns:repeat(2,minmax(0,1fr))}.doorgrid{grid-template-columns:1fr}}
@media(max-width:820px){
  .shell{grid-template-columns:64px 1fr}
  .brand strong,.brand small,.navbtn span:first-child{display:none}
  .rail{padding:14px 6px}
  .navbtn{justify-content:center}
  .stage{padding:20px 14px 70px}
  .grid.two,.grid.three,.grid.four{grid-template-columns:1fr}
  .capture{min-width:0}
  .capture input{width:110px}
}
</style>
</head>

</div>

<div class="overlay" id="modalOverlay"><div class="modal" id="modalBody"></div></div>
<div class="overlay" id="paletteOverlay"><div class="modal palette">

</div></div>

function doorState(done){ const o={}; DOOR_STAGES.forEach(s=>o[s]=done.includes(s)); return o; }
function doorPct(door){ if(!door) return 0; const vals=DOOR_STAGES.map(s=>door[s]?1:0); return Math.round(vals.reduce((a,b)=>a+b,0)/DOOR_STAGES.length*100); }
function uid(prefix){ return prefix+'_'+Math.random().toString(36).slice(2,9); }
function esc(v=''){ return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function nl2br(v=''){ return esc(v).replace(/\n/g,'<br>'); }
function fmtDate(d){ if(!d) return '—'; try{return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}catch{return d;} }

const STORE_KEY = 'tds_command_center_v1';
let state = load();
let active = (location.hash.replace('#/','').split('/')[0]) || 'home';

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){ const parsed = JSON.parse(raw); if(parsed && parsed.projects) return parsed; }
  }catch(e){ console.error('Command Center: failed to load saved state, using seed data.', e); }
  const seed = seedData();
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(seed)); }catch(e){}
  return seed;
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch(e){ console.error('Command Center: failed to save state.', e); }
}
function project(id){ return state.projects.find(p=>p.id===id); }
function task(id){ return state.tasks.find(t=>t.id===id); }
function client(id){ return state.clients.find(c=>c.id===id); }

function statusPill(s){
  const good=['Approved','Ready to Deploy','Live','Done','Pass','Connected'];
  const warn=['Needs Audit','Needs Revision','Waiting on Nev','Revise','Pass with notes','Ready to Connect'];
  const bad=['Blocked'];
  let cls='neutral';
  if(good.includes(s)) cls='good'; else if(warn.includes(s)) cls='warn'; else if(bad.includes(s)) cls='bad';
  return `<span class="pill ${cls}">${esc(s)}</span>`;
}

/* ---------- INBOX ---------- */
function renderInbox(){
  setHeader('QUICK CAPTURE','Inbox');
  const open = state.inbox.filter(i=>!i.converted);
  const done = state.inbox.filter(i=>i.converted);
  view_el.innerHTML = `
    <div class="card">
      <div class="kicker">UNPROCESSED</div>
      ${open.length? open.map(i=>`
        <div class="row-flex">
          <span>${esc(i.text)}</span>
          <div class="actions" style="margin-top:0">
            <button class="btn small" data-convert="${i.id}" data-type="Task">TASK</button>
            <button class="btn small" data-convert="${i.id}" data-type="Bug">BUG</button>
            <button class="btn small" data-convert="${i.id}" data-type="Idea">IDEA</button>
            <button class="btn small" data-convert="${i.id}" data-type="Client follow-up">CLIENT FOLLOW-UP</button>
            <button class="btn small" data-convert="${i.id}" data-type="Business/admin task">BUSINESS/ADMIN</button>
            <button class="btn small" data-convert="${i.id}" data-type="Project note">PROJECT NOTE</button>
          </div>
        </div>
      `).join('') : '<div class="empty">Inbox is empty. Use "Dump it here" at the top of any screen.</div>'}
    </div>
    ${done.length? `<div class="card" style="margin-top:12px"><div class="kicker">CONVERTED</div>${done.map(i=>`<div class="row-flex"><span class="muted">${esc(i.text)}</span><span class="pill neutral">→ ${esc(i.converted)}</span></div>`).join('')}</div>` : ''}
  `;
  view_el.querySelectorAll('[data-convert]').forEach(b=>b.onclick=()=>convertInboxItem(b.dataset.convert,b.dataset.type));
}
function convertInboxItem(id,type){
  const item = state.inbox.find(i=>i.id===id);
  if(!item) return;
  if(type==='Project note'){
    const pid = prompt('Which project id should this note attach to? Options: '+state.projects.map(p=>p.id).join(', '));
    const p = project(pid);
    if(!p){ alert('Project not found — nothing converted.'); return; }
    p.notes = (p.notes?p.notes+'\n':'') + item.text;
  } else {
    const prefix = {Bug:'Bug: ', Idea:'Idea: ', 'Client follow-up':'Follow-up: ', 'Business/admin task':'', Task:''}[type] || '';
    const t = {id:uid('task'), title:prefix+item.text, project:'', description: type==='Business/admin task'?'(Business/Admin) '+item.text:'', priority: type==='Bug'?'High':'Medium', status:'Backlog', worker:'Unassigned', created:new Date().toISOString().slice(0,10), due:'', deps:'', links:'', auditNotes:'', completionNotes:''};
    state.tasks.push(t);
  }
  item.converted = type;
  save(); renderInbox();
}

/* ---------- SETTINGS ---------- */
function renderSettings(){
  setHeader('DATA & PREFERENCES','Settings');
  view_el.innerHTML = `
    <div class="card">
      <div class="kicker">BACKUP</div>
      <p class="muted">All Command Center data lives in this browser's local storage. Export a backup regularly, especially before clearing browser data.</p>
      <div class="actions">
        <button class="btn primary" id="exportBtn">EXPORT BACKUP (.json)</button>
        <button class="btn" id="importBtn">IMPORT BACKUP</button>
        <input type="file" id="importFile" accept="application/json" style="display:none">
      </div>
    </div>
    <div class="card" style="margin-top:12px">
      <div class="kicker">RESET</div>
      <p class="muted">Reload the original seed data. This replaces everything currently saved in this browser.</p>
      <div class="actions"><button class="btn danger" id="resetBtn">RESET TO SEED DATA</button></div>
    </div>
  `;
  view_el.querySelector('#exportBtn').onclick=()=>{
    const blob = new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'tds-command-center-backup-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  };
  const fileInput = view_el.querySelector('#importFile');
  view_el.querySelector('#importBtn').onclick=()=>fileInput.click();
  fileInput.onchange=()=>{
    const file = fileInput.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload=()=>{
      try{
        const parsed = JSON.parse(reader.result);
        if(!parsed || !Array.isArray(parsed.projects)) throw new Error('Not a valid Command Center backup.');
        state = parsed; save(); render([active]);
        alert('Backup imported.');
      }catch(e){ alert('Import failed: '+e.message); }
    };
    reader.readAsText(file);
  };
  view_el.querySelector('#resetBtn').onclick=()=>{
    if(!confirm('This replaces all current data with the original seed data. Continue?')) return;
    state = seedData(); save(); render([active]);
  };
}

/* ---------- MODAL / PALETTE ---------- */
function openModal(){ modalOverlay.classList.add('open'); }
function closeModal(){ modalOverlay.classList.remove('open'); modalBody.innerHTML=''; }
modalOverlay.addEventListener('click',e=>{ if(e.target===modalOverlay) closeModal(); });

function paletteIndex(){
  const items = [];
  NAV.forEach(([id,label])=>items.push({label:label, sub:'Section', action:()=>go(id)}));
  state.projects.forEach(p=>items.push({label:p.name, sub:'Project · '+p.stage, action:()=>go('projects/'+p.id)}));
  state.tasks.forEach(t=>items.push({label:t.title, sub:'Task · '+t.status, action:()=>{go('tasks');}}));
  state.clients.forEach(c=>items.push({label:c.name||c.business, sub:'Client · '+c.status, action:()=>go('clients')}));
  state.projects.forEach(p=>{ if(p.links.file) items.push({label:p.links.file, sub:'File · '+p.name, action:()=>go('projects/'+p.id)}); });
  return items;
}
function openPalette(){
  paletteOverlay.classList.add('open');
  paletteInput.value='';
  renderPaletteList('');
  paletteInput.focus();
}
function closePalette(){ paletteOverlay.classList.remove('open'); }
function renderPaletteList(q){
  const idx = paletteIndex();
  const filtered = q? idx.filter(i=>i.label.toLowerCase().includes(q.toLowerCase())) : idx.slice(0,12);
  paletteList.innerHTML = filtered.length? filtered.slice(0,30).map((i,n)=>`<div class="palette__item" data-idx="${n}"><span>${esc(i.label)}</span><span>${esc(i.sub)}</span></div>`).join('') : '<div class="empty">No matches.</div>';
  paletteList.querySelectorAll('[data-idx]').forEach(el=>el.onclick=()=>{ filtered[Number(el.dataset.idx)].action(); closePalette(); });
}
paletteInput?.addEventListener('input',()=>renderPaletteList(paletteInput.value));
paletteOverlay.addEventListener('click',e=>{ if(e.target===paletteOverlay) closePalette(); });
paletteBtn.onclick = openPalette;
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); openPalette(); }
  if(e.key==='Escape'){ closePalette(); closeModal(); }
});

/* ---------- QUICK CAPTURE ---------- */
captureInput.addEventListener('keydown',e=>{
  if(e.key==='Enter' && captureInput.value.trim()){
    state.inbox.unshift({id:uid('inbox'), text:captureInput.value.trim(), createdAt:new Date().toISOString(), converted:null});
    save();
    captureInput.value='';
    if(active==='inbox') renderInbox();
  }
});

/* ---------- ROUTER ---------- */
const RENDERERS = {
  home:renderHome, projects:renderProjects, tasks:renderTasks, door:renderDoor,
  audit:renderAudit, clients:renderClients, ai:renderAI, business:renderBusiness,
  integrations:renderIntegrations, inbox:renderInbox, reference:renderReference, settings:renderSettings
};
function render(parts){
  const view = parts[0] || 'home';
  const sub = parts[1];
  (RENDERERS[view]||renderHome)(sub);
}

/* ---------- BOOT ---------- */
function tick(){
  clockEl.textContent = new Date().toLocaleString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
  sysdot.classList.toggle('off', !navigator.onLine);
}

if(!location.hash) location.hash = '#/home';
renderNav();
render([active]);
tick();
setInterval(tick,30000);

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(err=>console.error('Service worker registration failed:', err));
  });
}
